services:
  postgres:
    image: postgres:17.11-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meterforge
      POSTGRES_USER: meterforge
      POSTGRES_PASSWORD: meterforge
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterforge -d meterforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.0-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MeterForgeLocalDevCluster01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "${WIREMOCK_PORT:-9990}:8080"
    volumes:
      - ./infra/wiremock:/home/wiremock
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/__admin/mappings || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  control-plane:
    build:
      context: .
      dockerfile: backend/control-plane/Dockerfile
    ports:
      - "${CONTROL_PLANE_PORT:-8880}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meterforge
      DB_USERNAME: meterforge
      DB_PASSWORD: meterforge
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8890}:8090"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/worker/Dockerfile
    ports:
      - "${WORKER_PORT:-8870}:8070"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meterforge
      DB_USERNAME: meterforge
      DB_PASSWORD: meterforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8070/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: frontend/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://control-plane:8080
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:8090
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pg-data:
  redis-data:
