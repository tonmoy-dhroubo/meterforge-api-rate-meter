server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meterforge}
    username: ${DB_USERNAME:meterforge}
    password: ${DB_PASSWORD:meterforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: meterforge
  flyway:
    enabled: true
    schemas:
      - meterforge
    default-schema: meterforge
    create-schemas: true
    locations:
      - classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

meterforge:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-random-secret-at-least-32-chars}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    cookie-name: mf_session
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  api-key:
    pepper: ${API_KEY_PEPPER:dev-secret-pepper-change-in-production-12345678}


