spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: meterforge
  flyway:
    enabled: true
    schemas:
      - meterforge
    default-schema: meterforge
    create-schemas: true
    locations:
      - classpath:db/migration

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.autoconfigure.orm.jpa: DEBUG

meterforge:
  jwt:
    secret: test-secret-key-that-is-at-least-32-chars-long
    expiration-seconds: 3600
    cookie-name: mf_session
    cookie-secure: false
